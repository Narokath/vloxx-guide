/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P3 · Sword</text><path d="M44 82H676" stroke="#454331"/><g transform="translate(0,25)"><circle cx="360" cy="220" r="75" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M350 147 L360 129 L370 147" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="360" y="228" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><circle cx="360" cy="200" r="120" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="270" cy="445" r="120" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="450" cy="445" r="120" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="360" cy="200" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M360 160 l13 17 -13 17 -13 -17Z" fill="#b986ea"/><circle cx="347.5" cy="265" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="372.5" cy="265" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="270" cy="445" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="310" cy="382" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="300" cy="410" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="288" cy="390" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="450" cy="445" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="410" cy="382" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="420" cy="410" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/></g><text x="360" y="140" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Healers</text><text x="255" y="525" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Melee</text><text x="465" y="525" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Ranged</text><rect x="38" y="764" width="644" height="365" rx="5" fill="#151b2b" stroke="#353c49"/><text x="58" y="802" font-size="20" fill="#e8c976" font-weight="600" text-anchor="start">PLACEMENT</text><path d="M58 816H662" stroke="#343a48"/><circle cx="62" cy="843" r="3.5" fill="#e8c976"/><text x="82" y="851" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Fixate stays close in front;</text><text x="82" y="882" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">healers soak behind boss centre.</text><circle cx="62" cy="917" r="3.5" fill="#e8c976"/><text x="82" y="925" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Back up rear greens to clear fixate’s green.</text><circle cx="62" cy="960" r="3.5" fill="#e8c976"/><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Rear soakers stay near the</text><text x="82" y="999" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">centre line in one green each.</text></g><g transform="translate(2160,110)"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P4 · Bunker</text><path d="M44 82H676" stroke="#454331"/><circle cx="360" cy="148" r="55" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M350 95 L360 77 L370 95" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="360" y="156" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><g transform="translate(0,100)"><circle cx="360.0" cy="278.4" r="153.6" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="254.39999999999998" cy="460.8" r="153.6" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="465.6" cy="460.8" r="153.6" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="360" cy="400" r="153.6" fill="#b986ea0a" stroke="#b986ea" stroke-width="3"/><c