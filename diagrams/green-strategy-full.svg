text x="82" y="894" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Overlap green edges inside</text><text x="82" y="925" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">the projectile field.</text><circle cx="62" cy="960" r="3.5" fill="#e8c976"/><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Keep every soaker in one</text><text x="82" y="999" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">green’s exclusive area.</text><circle cx="62" cy="1034" r="3.5" fill="#e8c976"/><text x="82" y="1042" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Higher uptime; maintain the field</text><text x="82" y="1073" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">rotation. Not viable in LCM.</text></g><g transform="translate(2880,110)"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P4 · Boneskinner</text><path d="M44 82H676" stroke="#454331"/><circle cx="470" cy="145" r="55" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M460 92 L470 74 L480 92" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="470" y="153" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><circle cx="470" cy="310" r="77" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="470" cy="310" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="446" cy="292" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="494" cy="292" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="470" cy="332" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="470" cy="475" r="77" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="470" cy="475" r="9" fill="#