="400" text-anchor="start">Keep all three greens soaked behind Vloxx.</text><circle cx="62" cy="929" r="3.5" fill="#e8c976"/><text x="82" y="937" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Move left together out of</text><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">spears and third-wave puddles.</text><circle cx="62" cy="1003" r="3.5" fill="#e8c976"/><text x="82" y="1011" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Lower uptime; keep up with the</text><text x="82" y="1042" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">group while resolving greens.</text></g></g></svg>