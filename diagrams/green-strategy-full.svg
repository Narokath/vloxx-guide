<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 1310" width="3600" height="1310" role="img" aria-labelledby="title"><title id="title">Complete WRDL green strategy, P1 to P4</title><rect width="3600" height="1310" fill="#0a0e18"/><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><text x="44" y="54" font-size="32" fill="#e8c976" font-weight="600" text-anchor="start">GREEN STRATEGY · P1–P4</text><text x="44" y="88" font-size="21" fill="#a8aaaf" font-weight="400" text-anchor="start">Three valid soakers per green. Stand in one circle only. Both healers avoid baiting separate greens.</text><g transform="translate(2770,-1110)"><circle cx="58" cy="1165" r="7" fill="#eae6da"/><circle cx="210" cy="1165" r="7" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M420 1154l8 11-8 11-8-11Z" fill="#b986ea"/><circle cx="565" cy="1165" r="10" fill="none" stroke="#54c991" stroke-width="2.5"/><text x="76" y="1172" font-size="20" fill="#a8aaaf" font-weight="400" text-anchor="start">Player</text><text x="228" y="1172" font-size="20" fill="#a8aaaf" font-weight="400" text-anchor="start">Green holder</text><text x="438" y="1172" font-size="20" fill="#a8aaaf" font-weight="400" text-anchor="start">Fixate</text><text x="585" y="1172" font-size="20" fill="#a8aaaf" font-weight="400" text-anchor="start">Green</text></g><g transform="translate(0,110)"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P1 · Staff</text><path d="M44 82H676" stroke="#454331"/><circle cx="360" cy="210" r="60" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M350 268 L360 286 L370 268" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="360" y="218" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><circle cx="210" cy="280" r="100" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="210" cy="280" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="186" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="234" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="210" cy="302" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="510" cy="280" r="100" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="510" cy="280" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="486" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="534" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="360" cy="470" r="100" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="360" cy="470" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M360 430 l13 17 -13 17 -13 -17Z" fill="#b986ea"/><circle cx="336" cy="480" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="384" cy="480" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><text x="210" y="350" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Melee</text><text x="510" y="350" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Ranged</text><text x="360" y="540" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Healers</text><rect x="38" y="764" width="644" height="365" rx="5" fill="#151b2b" stroke="#353c49"/><text x="58" y="802" font-size="20" fill="#e8c976" font-weight="600" text-anchor="start">PLACEMENT</text><path d="M58 816H662" stroke="#343a48"/><circle cx="62" cy="843" r="3.5" fill="#e8c976"/><text x="82" y="851" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Bait greens close; faster holder takes right.</text><circle cx="62" cy="886" r="3.5" fill="#e8c976"/><text x="82" y="894" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Melee left · ranged right</text><text x="82" y="925" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">· healers/fixate rear.</text><circle cx="62" cy="960" r="3.5" fill="#e8c976"/><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Floater joins fixate if a healer</text><text x="82" y="999" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">is fixated; otherwise melee.</text><circle cx="62" cy="1034" r="3.5" fill="#e8c976"/><text x="82" y="1042" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Both healers avoid baiting their own greens.</text></g><g transform="translate(720,110)"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P2 · Spear</text><path d="M44 82H676" stroke="#454331"/><path d="M320 244.282 L65 685.955 M400 244.282 L655 685.955" fill="none" stroke="#f2827b" stroke-width="5"/><circle cx="360" cy="175" r="56" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M350 229 L360 247 L370 229" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="360" y="183" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><circle cx="360" cy="355" r="80" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="360" cy="355" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="336" cy="337" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="384" cy="337" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="360" cy="377" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="280" cy="550" r="88" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="280" cy="550" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M280 510 l13 17 -13 17 -13 -17Z" fill="#b986ea"/><circle cx