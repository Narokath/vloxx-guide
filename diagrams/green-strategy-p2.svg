<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1520" width="720" height="1520" role="img" aria-labelledby="title desc"><title id="title">P2 · Spear green formation</title><desc id="desc">Keep all three greens between the red lines: melee at the front, healers back left and ranged back right. Both healers join fixate. If a healer is fixated, the floater joins them so that green has three people. If two melee players get greens, both head back right. The player in front goes to ranged; the other stays at the front with melee. A ranged player who gets a green stays back right. If melee has only two people, a ranged player without a green moves to the front.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1520" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1480" rx="7" fill="#101524" stroke="#343a48"/><text x="44" y="65" font-size="36" fill="#e8c976" text-anchor="start" font-weight="600">P2 · Spear</text><text x="44" y="98" font-size="19" fill="#a8aaaf" text-anchor="start" font-weight="500">70–40%</text><path d="M44 116H676" fill="none" stroke="#454331" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M320 244.282L25 755.237M400 244.282L695 755.237" fill="none" stroke="#f2827b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="360" cy="175" r="56" fill="#69707b55" stroke="#969ca8" stroke-width="2" /><path d="M349 229L360 248L371 229" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="184" font-size="27" fill="#eae6da" text-anchor="middle" font-weight="500">Vloxx</text><circle cx="360" cy="410" r="100" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="360" cy="410" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="336" cy="390" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="384" cy="390" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="360" cy="372" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="360" y="480" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Melee</text><circle cx="260" cy="650" r="100" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="260" cy="650" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><path d="M260 607l14 18-14 18-14-18Z" fill="#b986ea" stroke="#b986ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="236" cy="630" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="284" cy="630" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="260" y="720" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Healers</text><circle cx="460" cy="650" r="100" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="460" cy="650" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="436" cy="630" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="484" cy="630" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="460" y="720" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Ranged</text><path d="M399 505L421 555M407 541L421 555L421 535" fill="none" stroke="#e8c976" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M44 866H676" fill="none" stroke="#343a48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="909" font-size="27" fill="#e8c976" text-anchor="start" font-weight="500">Placement</text><circle cx="62" cy="945" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="954" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Keep all three greens between the red</text><text x="82" y="984" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">lines: melee at the front, healers</text><text x="82" y="1014" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">back left and ranged back right.</text><circle cx="62" cy="1047" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1056" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Both healers join fixate. If a</text><text x="82" y="1086" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">healer is fixated, the floater joins</text><text x="82" y="1116" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">them so that green has three people.</text><circle cx="62" cy="1149" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1158" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">If two melee players get greens, both head back</text><text x="82" y="1188" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">right. The player in front goes to ranged; the</text><text x="82" y="1218" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">other stays at the front with melee.</text><circle cx="62" cy="1251" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1260" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">A ranged player who gets a green stays back</text><text x="82" y="1290" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">right. If melee has only two people, a ranged</text><text x="82" y="1320" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">player without a green moves to the front.</text></g></svg>