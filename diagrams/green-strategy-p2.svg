<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" width="720" height="1200" role="img" aria-labelledby="title desc"><title id="title">P2 · Spear green formation</title><desc id="desc">Ten players in three green groups. Keep all greens inside the same safe wedge. Melee front · healers + fixate back left · ranged back right. Floater joins fixate if a healer is fixated; otherwise melee.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P2 · Spear</text><path d="M44 82H676" stroke="#454331"/><path d="M320 244.282 L65 685.955 M400 244.282 L655 685.955" fill="none" stroke="#f2827b" stroke-width="5"/><circle cx="360" cy="175" r="56" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M350 229 L360 247 L370 229" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="360" y="183" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><circle cx="360" cy="355" r="80" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="360" cy="355" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="336" cy="337" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="384" cy="337" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="360" cy="377" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="280" cy="550" r="88" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="280" cy="550" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M280 510 l13 17 -13 17 -13 -17Z" fill="#b986ea"/><circle cx="256" cy="560" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="304" cy="560" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="440" cy="550" r="88" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="440" cy="550" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="416" cy="532" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="464" cy="532" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><text x="360" y="415" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Melee</text><text x="280" y="615" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Healers</text><text x="440" y="615" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Ranged</text><rect x="38" y="764" width="644" height="365" rx="5" fill="#151b2b" stroke="#353c49"/><text x="58" y="802" font-size="20" fill="#e8c976" font-weight="600" text-anchor="start">PLACEMENT</text><path d="M58 816H662" stroke="#343a48"/><circle cx="62" cy="843" r="3.5" fill="#e8c976"/><text x="82" y="851" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Keep all greens inside the same safe wedge.</text><circle cx="62" cy="886" r="3.5" fill="#e8c976"/><text x="82" y="894" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Melee front · healers + fixate</text><text x="82" y="925" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">back left · ranged back right.</text><circle cx="62" cy="960" r="3.5" fill="#e8c976"/><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Floater joins fixate if a healer</text><text x="82" y="999" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">is fixated; otherwise melee.</text></g></svg>