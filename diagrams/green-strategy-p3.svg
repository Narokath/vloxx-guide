<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1520" width="720" height="1520" role="img" aria-labelledby="title desc"><title id="title">P3 · Sword green formation</title><desc id="desc">Fixate stands inside Vloxx’s hitbox, just in front of his centre. Both healers stand just behind his centre, inside fixate’s green. The players with the other two greens move behind Vloxx, to the left and right. Move far enough back that neither circle overlaps fixate’s green. Everyone else joins their assigned green. Stand toward the middle of the formation while staying inside only your own circle.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1520" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1480" rx="7" fill="#101524" stroke="#343a48"/><text x="44" y="65" font-size="36" fill="#e8c976" text-anchor="start" font-weight="600">P3 · Sword</text><text x="44" y="98" font-size="19" fill="#a8aaaf" text-anchor="start" font-weight="500">40–10%</text><path d="M44 116H676" fill="none" stroke="#454331" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M360 150V740" fill="none" stroke="#424a58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/><circle cx="360" cy="265" r="120" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="270" cy="530" r="120" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="450" cy="530" r="120" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="360" cy="285" r="72" fill="#69707b55" stroke="#969ca8" stroke-width="2" /><path d="M349 215L360 196L371 215" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="294" font-size="27" fill="#eae6da" text-anchor="middle" font-weight="500">Vloxx</text><circle cx="360" cy="265" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><path d="M360 222l14 18-14 18-14-18Z" fill="#b986ea" stroke="#b986ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="347.5" cy="330" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="372.5" cy="330" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="270" cy="530" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="310" cy="467" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="300" cy="495" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="288" cy="475" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="450" cy="530" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="410" cy="467" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="420" cy="495" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="360" y="185" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Healers</text><text x="255" y="610" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Melee</text><text x="465" y="610" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Ranged</text><path d="M44 866H676" fill="none" stroke="#343a48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="909" font-size="27" fill="#e8c976" text-anchor="start" font-weight="500">Placement</text><circle cx="62" cy="945" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="954" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Fixate stands inside Vloxx’s hitbox, just in</text><text x="82" y="984" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">front of his centre. Both healers stand just</text><text x="82" y="1014" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">behind his centre, inside fixate’s green.</text><circle cx="62" cy="1047" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1056" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">The players with the other two greens move behind</text><text x="82" y="1086" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Vloxx, to the left and right. Move far enough</text><text x="82" y="1116" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">back that neither circle overlaps fixate’s green.</text><circle cx="62" cy="1149" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1158" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Everyone else joins their assigned green.</text><text x="82" y="1188" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Stand toward the middle of the formation</text><text x="82" y="1218" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">while staying inside only your own circle.</text></g></svg>