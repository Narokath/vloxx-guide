445" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="410" cy="382" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="420" cy="410" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/></g><text x="360" y="140" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Healers</text><text x="255" y="525" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Melee</text><text x="465" y="525" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Ranged</text><rect x="38" y="764" width="644" height="365" rx="5" fill="#151b2b" stroke="#353c49"/><text x="58" y="802" font-size="20" fill="#e8c976" font-weight="600" text-anchor="start">PLACEMENT</text><path d="M58 816H662" stroke="#343a48"/><circle cx="62" cy="843" r="3.5" fill="#e8c976"/><text x="82" y="851" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Fixate stays close in front;</text><text x="82" y="882" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">healers soak behind boss centre.</text><circle cx="62" cy="917" r="3.5" fill="#e8c976"/><text x="82" y="925" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Back up rear greens to clear fixate’s green.</text><circle cx="62" cy="960" r="3.5" fill="#e8c976"/><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Rear soakers stay near the</text><text x="82" y="999" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">centre line in one green each.</text></g></svg>