<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1520" width="720" height="1520" role="img" aria-labelledby="title desc"><title id="title">P1 · Staff green formation</title><desc id="desc">Fixate always gets a green. Both healers join that player; if a healer is fixated, the floater joins them to make three. Melee stand closest to Vloxx to get the other two greens. Ranged players stay farther away. If two melee players get greens, both start moving right. The player in front goes to ranged; the other stays with melee. A ranged player who gets a green stays with ranged. If melee has only two people, a ranged player without a green moves to melee.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1520" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1480" rx="7" fill="#101524" stroke="#343a48"/><text x="44" y="65" font-size="36" fill="#e8c976" text-anchor="start" font-weight="600">P1 · Staff</text><text x="44" y="98" font-size="19" fill="#a8aaaf" text-anchor="start" font-weight="500">100–70%</text><path d="M44 116H676" fill="none" stroke="#454331" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="360" cy="260" r="62" fill="#69707b55" stroke="#969ca8" stroke-width="2" /><path d="M349 320L360 339L371 320" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="269" font-size="27" fill="#eae6da" text-anchor="middle" font-weight="500">Vloxx</text><circle cx="200" cy="380" r="105" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="200" cy="380" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="224" cy="358" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="240" cy="380" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="212" cy="340" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="200" y="455" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Melee</text><circle cx="520" cy="380" r="105" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="520" cy="380" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="496" cy="360" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="544" cy="360" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="520" y="455" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Ranged</text><circle cx="360" cy="630" r="105" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="360" cy="630" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><path d="M360 587l14 18-14 18-14-18Z" fill="#b986ea" stroke="#b986ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="336" cy="610" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="384" cy="610" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="360" y="705" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Healers</text><path d="M310 380H410M393 368L410 380L393 392" fill="none" stroke="#e8c976" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M44 866H676" fill="none" stroke="#343a48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="909" font-size="27" fill="#e8c976" text-anchor="start" font-weight="500">Placement</text><circle cx="62" cy="945" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="954" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Fixate always gets a green. Both healers</text><text x="82" y="984" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">join that player; if a healer is fixated,</text><text x="82" y="1014" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">the floater joins them to make three.</text><circle cx="62" cy="1047" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1056" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Melee stand closest to Vloxx to get the other</text><text x="82" y="1086" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">two greens. Ranged players stay farther away.</text><circle cx="62" cy="1119" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1128" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">If two melee players get greens, both start</text><text x="82" y="1158" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">moving right. The player in front goes to</text><text x="82" y="1188" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">ranged; the other stays with melee.</text><circle cx="62" cy="1221" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1230" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">A ranged player who gets a green stays with</text><text x="82" y="1260" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">ranged. If melee has only two people, a</text><text x="82" y="1290" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">ranged player without a green moves to melee.</text></g></svg>