<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" width="720" height="1200" role="img" aria-labelledby="title desc"><title id="title">P1 · Staff green formation</title><desc id="desc">Ten players in three green groups. Bait greens close; faster holder takes right. Melee left · ranged right · healers/fixate rear. Floater joins fixate if a healer is fixated; otherwise melee. Both healers avoid baiting their own greens.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P1 · Staff</text><path d="M44 82H676" stroke="#454331"/><circle cx="360" cy="210" r="60" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M350 268 L360 286 L370 268" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="360" y="218" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><circle cx="210" cy="280" r="100" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="210" cy="280" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="186" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="234" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="210" cy="302" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="510" cy="280" r="100" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="510" cy="280" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="486" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="534" cy="262" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="360" cy="470" r="100" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="360" cy="470" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M360 430 l13 17 -13 17 -13 -17Z" fill="#b986ea"/><circle cx="336" cy="480" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="384" cy="480" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><text x="210" y="350" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Melee</text><text x="510" y="350" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Ranged</text><text x="360" y="540" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Healers</text><rect x="38" y="764" width="644" height="365" rx="5" fill="#151b2b" stroke="#353c49"/><text x="58" y="802" font-size="20" fill="#e8c976" font-weight="600" text-anchor="start">PLACEMENT</text><path d="M58 816H662" stroke="#343a48"/><circle cx="62" cy="843" r="3.5" fill="#e8c976"/><text x="82" y="851" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Bait greens close; faster holder takes right.</text><circle cx="62" cy="886" r="3.5" fill="#e8c976"/><text x="82" y="894" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Melee left · ranged right</text><text x="82" y="925" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">· healers/fixate rear.</text><circle cx="62" cy="960" r="3.5" fill="#e8c976"/><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Floater joins fixate if a healer</text><text x="82" y="999" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">is fixated; otherwise melee.</text><circle cx="62" cy="1034" r="3.5" fill="#e8c976"/><text x="82" y="1042" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Both healers avoid baiting their own greens.</text></g></svg>