<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1520" width="720" height="1520" role="img" aria-labelledby="title desc"><title id="title">P4 · Boneskinner green formation</title><desc id="desc">Line up behind Vloxx: melee nearest him, healers in the middle and ranged at the back. Keep at least three people in each green. Move left together to leave the Spear circles and third-wave Puddles behind. Move with the players in your green so everyone remains inside it.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1520" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1480" rx="7" fill="#101524" stroke="#343a48"/><text x="44" y="65" font-size="36" fill="#e8c976" text-anchor="start" font-weight="600">P4 · Boneskinner</text><text x="44" y="98" font-size="19" fill="#a8aaaf" text-anchor="start" font-weight="500">CM / LCM</text><path d="M44 116H676" fill="none" stroke="#454331" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="470" cy="155" r="55" fill="#69707b55" stroke="#969ca8" stroke-width="2" /><path d="M459 102L470 83L481 102" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="164" font-size="27" fill="#eae6da" text-anchor="middle" font-weight="500">Vloxx</text><circle cx="470" cy="310" r="88" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="470" cy="310" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="446" cy="290" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="494" cy="290" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="470" cy="272" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="470" y="368" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Melee</text><circle cx="470" cy="505" r="88" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="470" cy="505" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><path d="M470 462l14 18-14 18-14-18Z" fill="#b986ea" stroke="#b986ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="446" cy="485" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="494" cy="485" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="470" y="563" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Healers</text><circle cx="470" cy="700" r="88" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="470" cy="700" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="446" cy="680" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="494" cy="680" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="470" y="758" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Ranged</text><text x="215" y="444" font-size="27" fill="#e8c976" text-anchor="middle" font-weight="500">Move left</text><text x="215" y="478" font-size="27" fill="#e8c976" text-anchor="middle" font-weight="500">together</text><path d="M355 515H120M143 497L120 515L143 533" fill="none" stroke="#e8c976" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M44 866H676" fill="none" stroke="#343a48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="909" font-size="27" fill="#e8c976" text-anchor="start" font-weight="500">Placement</text><circle cx="62" cy="945" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="954" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Line up behind Vloxx: melee nearest him,</text><text x="82" y="984" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">healers in the middle and ranged at the back.</text><text x="82" y="1014" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Keep at least three people in each green.</text><circle cx="62" cy="1047" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1056" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Move left together to leave the Spear circles and</text><text x="82" y="1086" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">third-wave Puddles behind. Move with the players</text><text x="82" y="1116" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">in your green so everyone remains inside it.</text></g></svg>