<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" width="720" height="1200" role="img" aria-labelledby="title desc"><title id="title">P4 · Boneskinner green formation</title><desc id="desc">Ten players in three green groups. Melee front · healers/fixate mid · ranged rear. Keep all three greens soaked behind Vloxx. Move left together out of spears and third-wave puddles. Lower uptime; keep up with the group while resolving greens.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P4 · Boneskinner</text><path d="M44 82H676" stroke="#454331"/><circle cx="470" cy="145" r="55" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M460 92 L470 74 L480 92" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="470" y="153" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><circle cx="470" cy="310" r="77" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="470" cy="310" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="446" cy="292" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="494" cy="292" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="470" cy="332" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="470" cy="475" r="77" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="470" cy="475" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M470 435 l13 17 -13 17 -13 -17Z" fill="#b986ea"/><circle cx="446" cy="485" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="494" cy="485" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="470" cy="640" r="77" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="470" cy="640" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="446" cy="622" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="494" cy="622" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><path d="M290 460 H120 m24 -15 l-24 15 24 15" fill="none" stroke="#e8c976" stroke-width="5"/><text x="175" y="407" text-anchor="middle" font-size="28" fill="#e8c976" font-weight="400">Keep greens soaked</text><text x="175" y="439" text-anchor="middle" font-size="28" fill="#e8c976" font-weight="400">shift left together</text><text x="175" y="535" text-anchor="middle" font-size="28" fill="#a8aaaf" font-weight="400">Leave the spear</text><text x="175" y="565" text-anchor="middle" font-size="28" fill="#a8aaaf" font-weight="400">circles behind.</text><text x="470" y="365" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Melee</text><text x="470" y="530" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Healers</text><text x="470" y="695" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Ranged</text><rect x="38" y="764" width="644" height="365" rx="5" fill="#151b2b" stroke="#353c49"/><text x="58" y="802" font-size="20" fill="#e8c976" font-weight="600" text-anchor="start">PLACEMENT</text><path d="M58 816H662" stroke="#343a48"/><circle cx="62" cy="843" r="3.5" fill="#e8c976"/><text x="82" y="851" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Melee front · healers/fixate mid · ranged rear.</text><circle cx="62" cy="886" r="3.5" fill="#e8c976"/><text x="82" y="894" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Keep all three greens soaked behind Vloxx.</text><circle cx="62" cy="929" r="3.5" fill="#e8c976"/><text x="82" y="937" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Move left together out of</text><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">spears and third-wave puddles.</text><circle cx="62" cy="1003" r="3.5" fill="#e8c976"/><text x="82" y="1011" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Lower uptime; keep up with the</text><text x="82" y="1042" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">group while resolving greens.</text></g></svg>