<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" width="720" height="1200" role="img" aria-labelledby="title desc"><title id="title">P4 · Bunker green formation</title><desc id="desc">Ten players in three green groups. Keep melee and rear groups close behind Vloxx. Overlap green edges inside the projectile field. Keep every soaker in one green’s exclusive area. Higher uptime; maintain the field rotation. Not viable in LCM.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1200" rx="8" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1160" rx="6" fill="#101524" stroke="#343a48"/><text x="44" y="59" font-size="36" fill="#e8c976" font-weight="600" text-anchor="start">P4 · Bunker</text><path d="M44 82H676" stroke="#454331"/><circle cx="360" cy="148" r="55" fill="#69707b55" stroke="#969ca8" stroke-width="2"/><path d="M350 95 L360 77 L370 95" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linejoin="round"/><text x="360" y="156" text-anchor="middle" font-size="28" fill="#eae6da" font-weight="400">Vloxx</text><g transform="translate(0,100)"><circle cx="360.0" cy="278.4" r="153.6" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="254.39999999999998" cy="460.8" r="153.6" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="465.6" cy="460.8" r="153.6" fill="#54c99113" stroke="#54c991" stroke-width="2.5"/><circle cx="360" cy="400" r="153.6" fill="#b986ea0a" stroke="#b986ea" stroke-width="3"/><circle cx="360.0" cy="278.4" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="344.0" cy="265.6" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="376.0" cy="265.6" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="360.0" cy="256.0" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="254.39999999999998" cy="460.8" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><path d="M254.39999999999998 420.8 l13 17 -13 17 -13 -17Z" fill="#b986ea"/><circle cx="251.2" cy="483.2" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="264.0" cy="492.8" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="465.6" cy="460.8" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5"/><circle cx="468.8" cy="483.2" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><circle cx="456.0" cy="492.8" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2"/><text x="360" y="237" text-anchor="middle" font-size="28" fill="#54c991" font-weight="400">Melee</text></g><text x="225" y="665" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Healers</text><text x="495" y="665" font-size="28" fill="#54c991" font-weight="500" text-anchor="middle">Ranged</text><text x="668" y="245" font-size="28" fill="#b986ea" font-weight="500" text-anchor="end">Projectile Block</text><path d="M600 260 L360 500 M363 484 L360 500 L376 497" fill="none" stroke="#e8c976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="764" width="644" height="365" rx="5" fill="#151b2b" stroke="#353c49"/><text x="58" y="802" font-size="20" fill="#e8c976" font-weight="600" text-anchor="start">PLACEMENT</text><path d="M58 816H662" stroke="#343a48"/><circle cx="62" cy="843" r="3.5" fill="#e8c976"/><text x="82" y="851" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Keep melee and rear groups close behind Vloxx.</text><circle cx="62" cy="886" r="3.5" fill="#e8c976"/><text x="82" y="894" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Overlap green edges inside</text><text x="82" y="925" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">the projectile field.</text><circle cx="62" cy="960" r="3.5" fill="#e8c976"/><text x="82" y="968" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Keep every soaker in one</text><text x="82" y="999" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">green’s exclusive area.</text><circle cx="62" cy="1034" r="3.5" fill="#e8c976"/><text x="82" y="1042" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">Higher uptime; maintain the field</text><text x="82" y="1073" font-size="24" fill="#eae6da" font-weight="400" text-anchor="start">rotation. Not viable in LCM.</text></g></svg>