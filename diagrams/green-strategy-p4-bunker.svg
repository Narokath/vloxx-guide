<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1520" width="720" height="1520" role="img" aria-labelledby="title desc"><title id="title">P4 · Bunker green formation</title><desc id="desc">Use this formation in CM only. In LCM, P4 Spears cannot be blocked; use the Boneskinner formation instead. Place melee directly behind Vloxx, with healers left and ranged right. Overlap all three greens inside the purple projectile-block circle. Stand with your assigned group, inside your own green and outside any overlap with another green. Keep projectile blocks active to protect everyone from Spears.</desc><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><rect width="720" height="1520" fill="#0a0e18"/><rect x="20" y="20" width="680" height="1480" rx="7" fill="#101524" stroke="#343a48"/><text x="44" y="65" font-size="36" fill="#e8c976" text-anchor="start" font-weight="600">P4 · Bunker</text><text x="44" y="98" font-size="19" fill="#a8aaaf" text-anchor="start" font-weight="500">CM ONLY</text><path d="M44 116H676" fill="none" stroke="#454331" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M360 210V760" fill="none" stroke="#424a58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/><circle cx="360" cy="160" r="55" fill="#69707b55" stroke="#969ca8" stroke-width="2" /><path d="M349 107L360 88L371 107" fill="#e8c976" stroke="#e8c976" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="169" font-size="27" fill="#eae6da" text-anchor="middle" font-weight="500">Vloxx</text><circle cx="360.0" cy="378.4" r="153.6" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="254.39999999999998" cy="560.8" r="153.6" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="465.6" cy="560.8" r="153.6" fill="#54c99120" stroke="#54c991" stroke-width="2.5" /><circle cx="360" cy="500" r="153.6" fill="#b986ea0b" stroke="#b986ea" stroke-width="3" /><circle cx="360.0" cy="378.4" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="344.0" cy="365.6" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="376.0" cy="365.6" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="360.0" cy="356.0" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="254.39999999999998" cy="560.8" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><path d="M254.39999999999998 517.8l14 18-14 18-14-18Z" fill="#b986ea" stroke="#b986ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="251.2" cy="583.2" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="264.0" cy="592.8" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="465.6" cy="560.8" r="9" fill="#eae6da" stroke="#54c991" stroke-width="2.5" /><circle cx="468.8" cy="583.2" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><circle cx="456.0" cy="592.8" r="9" fill="#eae6da" stroke="#0a0e18" stroke-width="2" /><text x="360" y="310" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Melee</text><text x="225" y="665" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Healers</text><text x="495" y="665" font-size="28" fill="#54c991" text-anchor="middle" font-weight="500">Ranged</text><text x="676" y="242" font-size="28" fill="#b986ea" text-anchor="end" font-weight="500">Projectile Block</text><path d="M600 260L360 500M363 484L360 500L376 497" fill="none" stroke="#e8c976" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M44 866H676" fill="none" stroke="#343a48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="909" font-size="27" fill="#e8c976" text-anchor="start" font-weight="500">Placement</text><circle cx="62" cy="945" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="954" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Use this formation in CM only. In</text><text x="82" y="984" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">LCM, P4 Spears cannot be blocked; use</text><text x="82" y="1014" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">the Boneskinner formation instead.</text><circle cx="62" cy="1047" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1056" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Place melee directly behind Vloxx, with healers</text><text x="82" y="1086" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">left and ranged right. Overlap all three greens</text><text x="82" y="1116" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">inside the purple projectile-block circle.</text><circle cx="62" cy="1149" r="3.5" fill="#e8c976" stroke="none" stroke-width="1" /><text x="82" y="1158" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">Stand with your assigned group, inside</text><text x="82" y="1188" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">your own green and outside any overlap</text><text x="82" y="1218" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">with another green. Keep projectile blocks</text><text x="82" y="1248" font-size="23" fill="#eae6da" text-anchor="start" font-weight="400">active to protect everyone from Spears.</text></g></svg>